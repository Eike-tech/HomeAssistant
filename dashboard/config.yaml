name: Dashboard
version: "1.20.0"
slug: dashboard
description: Tablet cockpit for Home Assistant with energy, car, house and media controls
url: https://github.com/Eike-tech/HomeAssistant
image: ghcr.io/eike-tech/homeassistant-dashboard-{arch}
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:view-dashboard
panel_title: Dashboard
panel_admin: false
homeassistant_api: true
auth_api: true
options:
  hass_token: ""
  tibber_token: ""
  ipad_calendar_entities: []
schema:
  hass_token: str
  tibber_token: str?
  ipad_calendar_entities:
    - str
