name: Dashboard
version: "1.18.3"
slug: dashboard
description: Custom Home Assistant Dashboard with energy, climate, car, and media controls
url: https://github.com/Eike-tech/HomeAssistant
image: ghcr.io/eike-tech/homeassistant-dashboard-{arch}
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:view-dashboard
panel_title: Dashboard
homeassistant_api: true
auth_api: true
ports:
  3000/tcp: 3001
ports_description:
  3000/tcp: "Direct LAN access for /ipad-legacy (legacy browsers without HA login)"
options:
  hass_token: ""
  tibber_token: ""
  ipad_calendar_entities: []
schema:
  hass_token: str
  tibber_token: str?
  ipad_calendar_entities:
    - str
